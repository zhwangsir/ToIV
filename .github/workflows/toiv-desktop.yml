name: ToIV desktop (unsigned)

# Builds the ToIV desktop client (BeefTV Wails shell + ToIV login gate).
# Unsigned artifacts only: Apple Developer ID signing / notarization and a
# Windows code-signing certificate are not configured yet.
on:
  workflow_dispatch:
  push:
    tags: ['toiv-desktop-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-amd64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Select bundled Node runtime
        shell: bash
        run: |
          node -e 'const fs=require("fs"),p=require("path"); const bin=p.dirname(process.execPath); fs.appendFileSync(process.env.GITHUB_ENV, `BEEFTV_NODE_RUNTIME=${process.platform==="win32"?bin:p.dirname(bin)}\n`);'

      - name: Install MSYS2 UCRT64 GCC
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Assert DWARF 5 CGO compiler
        if: runner.os == 'Windows'
        env:
          MSYSTEM_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\ucrt64
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1

      - name: Build official plugin packages (incl. toiv-h3)
        shell: bash
        run: sh plugin-packages/build-packages.sh

      - name: Build ToIV for Windows
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
          BEEFTV_APP_ICON: ${{ github.workspace }}\assets\toiv-app-icon.png
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-beeftv-windows-release.ps1

      - name: Build ToIV for macOS
        if: runner.os != 'Windows'
        run: ./scripts/build-toiv-desktop.sh

      - name: Desktop gate tests
        working-directory: backend
        shell: bash
        run: go test ./cmd/desktop

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd backend/cmd/desktop/build/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$GITHUB_WORKSPACE/dist/ToIV-${{ matrix.platform }}-unsigned.zip" ToIV.exe plugin-packages agent-host cli
          else
            ditto -c -k --keepParent ToIV.app "$GITHUB_WORKSPACE/dist/ToIV-${{ matrix.platform }}-unsigned.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ToIV-${{ matrix.platform }}-unsigned
          path: dist/ToIV-${{ matrix.platform }}-unsigned.zip
          if-no-files-found: error
