<!doctype html><html class="dark"><head><meta charset=utf-8>
<style>/* =============================================================================
   ToIV Freezone Visual System — Design Tokens R1 (2026-10-26)
   ---------------------------------------------------------------------------
   TL nail (final):
     · main accent     #5ba0ff
     · aux (shadcn/青) #00bdcf
     · Beef #4f8cff    ONLY --toiv-glow-director (光幕/glow 辅通道); never floor/CTA
   Self-authored CSS. B-class = aesthetic values only (no source CSS copy).
   DNA: docs/ops/VISUAL_DNA_RESET_R1_20261026.md
   Sync twin: apps/web/app/styles/toiv-freezone-tokens.css (keep identical).
   ============================================================================= */

:root {
  /* ── Color: Freezone dark-first (DNA dramaclaw 1:1 · B aesthetic rewrite) ── */
  --toiv-bg: #0a0c12;
  --toiv-bg-rgb: 10 12 18;
  --toiv-surface: #15161d;
  --toiv-surface-rgb: 21 22 29;
  --toiv-surface-raised: #1b1c23;
  --toiv-surface-panel: #13141b;
  --toiv-surface-field: #0d0e14;

  --toiv-border: #22232c;
  --toiv-border-strong: #2f3036;
  --toiv-border-soft: #1f2026;
  --toiv-border-soft-alpha: rgba(255, 255, 255, 0.05);

  --toiv-text: #e8eaf0;
  --toiv-text-secondary: #b4b8c4;
  --toiv-text-muted: #9298a6;

  /* TL nail: main accent = canvas blue; cyan = form/shadcn aux */
  --toiv-accent: #5ba0ff;
  --toiv-accent-rgb: 91 160 255;
  --toiv-accent-hover: #7ab4ff;
  --toiv-accent-soft: rgba(91, 160, 255, 0.16);
  --toiv-accent-cyan: #00bdcf;
  --toiv-accent-cyan-hover: #1ad0e0;
  --toiv-accent-cyan-soft: rgba(0, 189, 207, 0.14);
  --toiv-primary: var(--toiv-accent-cyan); /* shadcn/form CTA surface */
  --toiv-text-on-accent: #111b21;
  /* legacy alias used by landing bridge before rename */
  --toiv-accent-secondary: var(--toiv-accent);
  --toiv-accent-secondary-rgb: var(--toiv-accent-rgb);
  --toiv-accent-secondary-soft: var(--toiv-accent-soft);

  --toiv-danger: #ea4335;
  --toiv-danger-soft: rgba(234, 67, 53, 0.14);
  --toiv-ok: #51bf6f;
  --toiv-warn: #efa831;

  /* NSFW lock — distinct purple (色+锁标); dual-channel; not main-path CTA */
  --toiv-nsfw-lock: #8b7cff;
  --toiv-nsfw-lock-deep: #3a2f6b;
  --toiv-nsfw-lock-soft: rgba(139, 124, 255, 0.12);

  /* ── Type scale (DNA + Freezone dense body fusion) ── */
  --toiv-fs-nano: 10px;
  --toiv-fs-aux: 11px;
  --toiv-fs-caption: 12px;
  --toiv-fs-body: 13px;
  --toiv-fs-body-md: 14px;
  --toiv-fs-section: 15px;
  --toiv-fs-body-lg: 16px;
  --toiv-fs-title: 18px;
  --toiv-fs-headline: 20px;
  --toiv-fs-display: 24px;
  --toiv-fs-display-lg: 30px;

  /* ── Radius (DNA + A Toonflow badge 8) ── */
  --toiv-radius-badge: 8px;
  --toiv-radius-control: 10px;
  --toiv-radius-card: 12px;
  --toiv-radius-field: 12px;
  --toiv-radius-node: 14px;
  --toiv-radius-panel: 16px;
  --toiv-radius-xl: 20px;
  --toiv-radius-full: 9999px;

  /* ── Shadows / glow ── */
  --toiv-shadow-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
  --toiv-shadow-panel: 0 14px 34px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
  --toiv-glow-accent: 0 0 24px rgb(var(--toiv-accent-rgb) / 0.25);
  --toiv-glow-primary: 0 0 24px rgba(0, 189, 207, 0.28);
  /* BeefTV director blue — ONLY light-curtain / glow aux channel (TL nail) */
  --toiv-director: #4f8cff;
  --toiv-director-rgb: 79 140 255;
  --toiv-glow-director: var(--toiv-switch-glow-nsfw);
  --toiv-focus-ring: 0 0 0 3px rgb(var(--toiv-accent-rgb) / 0.12);
  --toiv-blur-panel: saturate(180%) blur(18px);

  /* ── Spacing (4/8/12/16/24 + 32) ── */
  --toiv-space-1: 4px;
  --toiv-space-2: 8px;
  --toiv-space-3: 12px;
  --toiv-space-4: 16px;
  --toiv-space-5: 20px;
  --toiv-space-6: 24px;
  --toiv-space-8: 32px;

  --toiv-shell-sidebar: 216px;
  --toiv-shell-sidebar-collapsed: 56px;
  --toiv-shell-topbar: 56px;
  --toiv-shell-control: 32px;
  --toiv-shell-nav-row: 36px;

  /* ── Motion (DNA) ── */
  --toiv-duration-fast: 150ms;
  --toiv-duration-base: 220ms;
  --toiv-duration-slow: 320ms;
  --toiv-ease-out: cubic-bezier(0.22, 1, 0.36, 1);


  /* ── Mode switch (R2 TL nail · topbar quiet segmented pill) ──
     普通|成人；普通无 glow；成人 soft fill + #4f8cff glow。禁 iOS 大开关 / View Transition。
     创作台分段用 --toiv-create-mode-*，勿共用 NSFW glow。 */
  --toiv-switch-h: 28px; /* A0 DNA ≈28 */
  --toiv-switch-min-w: 108px;
  --toiv-switch-pad: 2px;
  --toiv-switch-gap: 0;
  --toiv-switch-item-px: 10px;
  --toiv-switch-radius: 9999px;
  --toiv-switch-fs: 12px;
  --toiv-switch-fw: 500;
  --toiv-switch-bg: #101118;
  --toiv-switch-border: rgba(255, 255, 255, 0.08);
  --toiv-switch-fg: var(--toiv-text-muted);
  --toiv-switch-fg-hover: #e8eaf0;
  --toiv-switch-fg-active-sfw: #e8eaf0;
  --toiv-switch-fg-active-nsfw: #4f8cff; /* TL: 字色跟光幕，不跟创作蓝 #5ba0ff */
  --toiv-switch-thumb-sfw: rgba(255, 255, 255, 0.08);
  --toiv-switch-thumb-nsfw: rgb(79 140 255 / 0.12);
  --toiv-switch-ring-nsfw: 0 0 0 1px rgb(79 140 255 / 0.45);
  --toiv-switch-glow-nsfw: 0 0 24px rgb(79 140 255 / 0.28);
  --toiv-switch-glow-hover: 0 0 16px rgb(79 140 255 / 0.18);
  --toiv-switch-focus: #7ab4ff;
  --toiv-switch-dur-color: 150ms;
  --toiv-switch-dur-thumb: 200ms;
  --toiv-switch-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --toiv-switch-disabled-opacity: 0.4;

  /* Legacy light-curtain aliases → switch spine (single source) */
  --toiv-light-curtain-h: var(--toiv-switch-h);
  --toiv-light-curtain-h-compact: var(--toiv-switch-h);
  --toiv-light-curtain-w: var(--toiv-switch-min-w);
  --toiv-light-curtain-w-min: var(--toiv-switch-min-w);
  --toiv-light-curtain-w-max: 124px;
  --toiv-light-curtain-w-compact: 56px;
  --toiv-light-curtain-fs: var(--toiv-switch-fs);

  /* ── Create studio three-pane (R3 TL nail · VISUAL_CREATE_SHELL_R3) ──
     左默认 240 / 右按需 320；分隔可视 1 / 命中 8；成人不改几何。
     分镜选中：右栏扩到 420（上限 480），取消回 320；不另开浮层。 */
  --toiv-create-left-default: 240px;
  --toiv-create-left-min: 200px;
  --toiv-create-left-max: 360px;
  --toiv-create-left-collapsed: 56px;
  --toiv-create-right-default: 320px;
  --toiv-create-right-min: 280px;
  --toiv-create-right-max: 420px;
  --toiv-create-right-expanded: 420px; /* shot detail selected */
  --toiv-create-right-expanded-max: 480px;
  --toiv-create-right-collapsed: 56px;
  --toiv-create-canvas-gutter: 0px;
  --toiv-create-canvas-inset: 12px;
  --toiv-create-splitter-visual: 1px;
  --toiv-create-splitter-hit: 8px;
  --toiv-create-splitter-bg: transparent;
  --toiv-create-splitter-hover: rgba(255, 255, 255, 0.06);
  --toiv-create-splitter-active: rgb(91 160 255 / 0.45);
  --toiv-create-shell-min-w: 1050px;
  --toiv-create-break-stack: 900px;
  --toiv-create-dur-collapse: 200ms;
  --toiv-create-ease: var(--toiv-ease-out, cubic-bezier(0.22, 1, 0.36, 1));
  --toiv-create-adult-geometry: unchanged;

  /* legacy aliases used by three-pane CSS */
  --toiv-create-rail-w: var(--toiv-create-left-default);
  --toiv-create-rail-w-collapsed: var(--toiv-create-left-collapsed);
  --toiv-create-inspector-w: var(--toiv-create-right-default);
  --toiv-create-inspector-w-min: var(--toiv-create-right-min);
  --toiv-create-gap: var(--toiv-space-2, 8px);
  --toiv-create-pad: var(--toiv-create-canvas-inset);
  --toiv-create-panel-bg: var(--toiv-surface);
  --toiv-create-panel-border: var(--toiv-border);
  --toiv-create-panel-radius: 0; /* shell flush; floating panels still use radius-panel */
  --toiv-create-divider: var(--toiv-border);
  --toiv-create-stage-bg: var(--toiv-bg);
  --toiv-create-section-gap: var(--toiv-space-3, 12px);
  --toiv-create-section-title-fs: var(--toiv-fs-caption, 12px);

  /* create-mode segmented — NO NSFW glow */
  --toiv-create-mode-h: 36px;
  --toiv-create-mode-pad: 4px;
  --toiv-create-mode-radius: 14px;
  --toiv-create-mode-radius-item: 12px;
  --toiv-create-mode-fs: 13px;
  --toiv-create-mode-fw: 600;
  --toiv-create-mode-bg: color-mix(in srgb, var(--toiv-surface) 88%, transparent);
  --toiv-create-mode-item-active-bg: var(--toiv-surface-raised);
  --toiv-create-mode-fg: var(--toiv-text-muted);
  --toiv-create-mode-fg-active: var(--toiv-text);
  --toiv-create-mode-dur: 200ms;
  --toiv-create-mode-ease: var(--toiv-create-ease);
  /* intentionally no --toiv-create-mode-glow; never alias --toiv-switch-glow-nsfw */

  /* ── Storyboard cards (R4 TL nail · VISUAL_STORYBOARD_CARDS_R4) ──
     主卡 16:9 + shot# + 2行摘要；gap 16 / radius 12；auto-fit minmax 220；
     双轨默认 PiP（草图 2:3 叠成片 16:9），不用 tab；成人不改几何。 */
  --toiv-shot-media-aspect: 16 / 9;
  --toiv-shot-media-aspect-sketch: 2 / 3;
  --toiv-shot-card-radius: 12px;
  --toiv-shot-card-border: 1px solid var(--toiv-border);
  --toiv-shot-card-border-active: 1px solid var(--toiv-accent);
  --toiv-shot-card-bg: var(--toiv-surface);
  --toiv-shot-card-header-h: 36px;
  --toiv-shot-card-header-pad-x: 12px;
  --toiv-shot-card-footer-pad: 12px;
  --toiv-shot-card-footer-lines: 2;
  --toiv-shot-card-footer-fs: 12px;
  --toiv-shot-meta-fs: 10px;
  --toiv-shot-grid-gap: 16px;
  --toiv-shot-grid-pad: 24px;
  --toiv-shot-grid-cols-default: 4;
  --toiv-shot-grid-cols-compact: 2;
  --toiv-shot-grid-cols-max: 5;
  --toiv-shot-detail-w: 420px;
  --toiv-shot-detail-w-max: 480px;
  --toiv-shot-kf-gap: 16px;
  --toiv-shot-nine-gap: 8px;
  --toiv-shot-nine-cols: 3;
  --toiv-shot-beat-gap: 14px;
  --toiv-shot-canvas-node-w: 440px;
  --toiv-shot-pip-w: 32%;
  --toiv-shot-adult-geometry: unchanged;



  /* ── Node graph (R5 tip + TL hard size nail · VISUAL_NODE_GRAPH_R5) ──
     宽 280–320 / compact 220 / media 338–440 / export 480；
     圆角 12–14；标题 28–32·字14；端口视觉8/命中~18/offset12；
     线 2 / 选中 2.5；glow 24px·0.25；grid gap 16；成人几何 unchanged。
     选中色 = accent #5ba0ff（禁成人 #4f8cff）。 */
  --toiv-node-w-default: 300px; /* midpoint of 280–320 */
  --toiv-node-w-compact: 220px;
  --toiv-node-w-media: 360px; /* within 338–440 */
  --toiv-node-w-export: 480px;
  --toiv-node-min-h: 120px;
  --toiv-node-radius: 12px;
  --toiv-node-radius-preferred: 14px;
  --toiv-node-radius-comfy: 8px;
  --toiv-node-title-h: 30px;
  --toiv-node-title-fs: 14px;
  --toiv-node-title-icon: 16px;
  --toiv-node-body-pad: 10px;
  --toiv-node-gutter: 12px;
  --toiv-node-bg: var(--toiv-surface);
  --toiv-node-fill: color-mix(in srgb, var(--toiv-surface) 88%, transparent);
  --toiv-node-fill-solid: var(--toiv-surface);
  --toiv-node-panel: var(--toiv-surface-raised, #1b1c23);
  --toiv-node-border: 1px solid var(--toiv-border);
  --toiv-node-stroke: var(--toiv-border);
  --toiv-node-stroke-hover: var(--toiv-border-strong, #2f3036);
  --toiv-node-stroke-active: var(--toiv-accent);
  --toiv-node-border-active: 1px solid var(--toiv-accent);
  --toiv-node-selected-ring: 0 0 0 1px rgb(91 160 255 / 0.45);
  --toiv-node-selected-glow: 0 0 24px rgb(91 160 255 / 0.25);
  --toiv-node-edge-light: rgb(255 255 255 / 0.07);
  --toiv-node-glass-blur: 14px;
  /* Freezone: prefer glow over heavy drop shadow */
  --toiv-node-shadow: none;
  --toiv-node-shadow-hover: var(--toiv-node-selected-ring);
  --toiv-node-shadow-selected: var(--toiv-node-selected-ring), var(--toiv-node-selected-glow);
  --toiv-node-port-d: 8px;
  --toiv-node-port-size: var(--toiv-node-port-d);
  --toiv-node-port-hit: 18px;
  --toiv-node-port-offset: 12px;
  --toiv-node-port-color: #94a3b8;
  --toiv-node-port-valid: var(--toiv-accent);
  --toiv-node-port-invalid: var(--toiv-danger, #ea4335);
  --toiv-node-port-ring: var(--toiv-node-port-valid);
  --toiv-node-port-fill: var(--toiv-bg);
  --toiv-node-port-glow: 0 0 0 3px rgb(91 160 255 / 0.22);
  --toiv-node-type-dot: 8px;
  --toiv-node-type-bar-w: 3px;
  --toiv-node-edge-stroke: 2px;
  --toiv-node-edge-stroke-active: 2.5px;
  --toiv-node-edge-stroke-comfy: 3px;
  --toiv-node-edge-idle-w: var(--toiv-node-edge-stroke);
  --toiv-node-edge-active-w: var(--toiv-node-edge-stroke-active);
  --toiv-node-edge-color: rgba(176, 176, 183, 0.45);
  --toiv-node-edge-color-active: rgb(91 160 255 / 0.94);
  --toiv-node-edge-idle: var(--toiv-node-edge-color);
  --toiv-node-edge-hit: 24px;
  --toiv-node-edge-glow-w: 8px;
  --toiv-node-edge-glow: rgb(91 160 255 / 0.25);
  --toiv-node-edge-disconnect: 32px;
  --toiv-node-grid-gap: 16px;
  --toiv-node-grid-gap-comfy: 10px;
  --toiv-node-grid-dot: 2px;
  --toiv-node-grid-dot-color: #4a4a4a;
  --toiv-node-snap-align: 8px;
  --toiv-node-snap-release: 12px;
  --toiv-node-param-section-gap: 12px;
  --toiv-node-param-section-pad: 10px;
  --toiv-node-param-radius: var(--toiv-radius-card, 12px);
  --toiv-node-dur: 200ms;
  --toiv-node-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --toiv-node-adult-geometry: unchanged;
  --toiv-node-type-image: var(--cn-type-image, #64B5F6);
  --toiv-node-type-video: var(--cn-type-video, #F472B6);
  --toiv-node-type-text: var(--cn-type-text, #94a3b8);
  --toiv-node-type-audio: var(--cn-type-audio, #4ADE80);
  --toiv-node-type-config: var(--cn-type-config, #B39DDB);
  --toiv-node-type-script: var(--cn-type-script, #00bdcf);
  --toiv-node-type-drawing: var(--cn-type-drawing, #FFD54F);
  --toiv-node-type-frame: var(--cn-type-frame, #6f7079);
  --toiv-node-type-skill: var(--cn-type-skill, #5ba0ff);
  --toiv-node-type-default: var(--toiv-node-port-color);



  /* ── Media library (R6 补钉 · VISUAL_MEDIA_LIBRARY_R6) ──
     网格 auto-fill minmax(220–240) · gap 16 · 卡圆角 12（画廊 14–16）；
     滤签 inset pill h~28；batch 60 + prefetch 480；
     hover border 150ms（可选 lift 4px @220ms）；
     thumb 图4:3 / 视频16:9 / 道具1:1；成人几何 unchanged。
     --toiv-asset-* 为左栏紧凑别名，映射到本块，避免两套打架。 */
  --toiv-media-grid-min: 220px;
  --toiv-media-grid-min-wide: 240px;
  --toiv-media-grid-gap: 16px;
  --toiv-media-grid-gap-dense: 10px;
  --toiv-media-grid-cols-sm: 2;
  --toiv-media-grid-cols-md: 3;
  --toiv-media-grid-cols-lg: 4;
  --toiv-media-grid-cols-xl: 5;
  --toiv-media-pad-x: 24px;
  --toiv-media-pad-y: 16px;
  --toiv-media-card-radius: 12px;
  --toiv-media-card-radius-rec: 12px;
  --toiv-media-card-radius-gallery: 14px;
  --toiv-media-card-radius-gallery-max: 16px;
  --toiv-media-card-border: 1px solid var(--toiv-border);
  --toiv-media-card-border-hover: 1px solid var(--toiv-border-strong, #2f3036);
  --toiv-media-card-border-selected: 1px solid var(--toiv-accent);
  --toiv-media-card-selected-ring: 0 0 0 1px rgb(91 160 255 / 0.45);
  --toiv-media-card-bg: var(--toiv-surface);
  --toiv-media-thumb-aspect: 4 / 3;
  --toiv-media-thumb-aspect-video: 16 / 9;
  --toiv-media-thumb-aspect-prop: 1 / 1;
  --toiv-media-thumb-list: 80px;
  --toiv-media-thumb-bg: var(--toiv-bg);
  --toiv-media-footer-pad: 12px;
  --toiv-media-title-fs: 14px;
  --toiv-media-meta-fs: 12px;
  --toiv-media-chip-h: 28px;
  --toiv-media-chip-pad-x: 12px;
  --toiv-media-chip-fs: 12px;
  --toiv-media-chip-radius: 999px;
  --toiv-media-chip-gap: 6px;
  --toiv-media-chip-track-pad: 3px;
  --toiv-media-chip-count-fs: 10px;
  --toiv-media-batch: 60;
  --toiv-media-prefetch-margin: 480px;
  --toiv-media-page-size-table: 10;
  --toiv-media-hover-lift: -4px;
  --toiv-media-hover-scale: 1.05;
  --toiv-media-hover-border-dur: 150ms;
  --toiv-media-hover-lift-dur: 220ms;
  --toiv-media-hover-delay: 0ms;
  --toiv-media-dur-fast: 150ms;
  --toiv-media-dur-lift: 220ms;
  --toiv-media-ease-lift: cubic-bezier(0.34, 1.56, 0.64, 1);
  --toiv-media-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --toiv-media-play-d: 43px;
  --toiv-media-star-hit: 28px;
  --toiv-media-more-hit: 28px;
  --toiv-media-toolbar-h: 48px;
  --toiv-media-search-max-w: 340px;
  --toiv-media-nsfw-veil: rgb(10 12 18 / 0.62);
  --toiv-media-adult-geometry: unchanged;

  /* Left-rail compact aliases → media nail (dense gap / smaller type) */
  --toiv-asset-grid-gap: var(--toiv-media-grid-gap-dense);
  --toiv-asset-grid-cols: var(--toiv-media-grid-cols-sm);
  --toiv-asset-card-radius: var(--toiv-media-card-radius-rec);
  --toiv-asset-card-bg: var(--toiv-media-card-bg);
  --toiv-asset-card-border: var(--toiv-media-card-border);
  --toiv-asset-card-border-hover: var(--toiv-media-card-border-hover);
  --toiv-asset-thumb-ratio: var(--toiv-media-thumb-aspect);
  --toiv-asset-thumb-bg: var(--toiv-media-thumb-bg);
  --toiv-asset-title-fs: 11px; /* rail denser than gallery 14 */
  --toiv-asset-meta-fs: 10px;
  --toiv-asset-chip-fs: var(--toiv-media-chip-fs);
  --toiv-asset-chip-h: var(--toiv-media-chip-h);
  --toiv-asset-chip-radius: var(--toiv-media-chip-radius);
  --toiv-asset-chip-gap: var(--toiv-media-chip-gap);
  --toiv-asset-filter-gap: var(--toiv-media-chip-gap);
  --toiv-asset-filter-h: var(--toiv-media-chip-h);
  --toiv-asset-pool-pad: 0;
  --toiv-asset-pool-max-h: min(42vh, 360px);
  --toiv-asset-empty-pad: 16px;
  --toiv-asset-nsfw-veil: var(--toiv-media-nsfw-veil);
  --toiv-asset-adult-geometry: var(--toiv-media-adult-geometry);



  /* ── Job / generation queue (R7 · VISUAL_JOB_QUEUE_R7 hard nail) ──
     行高92 · 缩略84×60 · 进度条3px fill #5ba0ff @420ms（禁假满条）·
     重试 hit 32×32 · 抽屉~736 / 日志 max-h240 · 侧栏快览320 ·
     入场 280ms translateX(24→0)；成人几何 unchanged。
     --toiv-queue-* 为兼容别名 → 本块。 */
  --toiv-job-row-min-h: 92px;
  --toiv-job-row-pad-y: 12px;
  --toiv-job-row-pad-x: 14px;
  --toiv-job-row-gap: 18px;
  --toiv-job-row-cols: 84px 1fr 120px 104px;

.app-user-workspace .fz-desk,
.fz-desk {
  color: var(--fz-ink);
  background: var(--fz-canvas);
}

.fz-desk-page {
  min-height: 100%;
  padding: 12px 16px 24px; /* A1 denser page chrome */
  background: var(--fz-canvas);
  color: var(--fz-ink);
}

.fz-desk-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px; /* A1: 4px denser tool strip */
  min-height: 32px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--fz-border);
}

.fz-desk-toolbar h1 {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 22px;
}

.fz-desk-toolbar p {
  margin: 0;
  width: 100%;
  font-size: 11px;
  line-height: 16px;
  color: var(--fz-muted);
}

.fz-desk-actions {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}

.fz-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px; /* A1 pill controls */
  border: 1px solid var(--fz-border);
  background: transparent;
  color: var(--fz-ink);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.fz-btn:hover { background: color-mix(in srgb, var(--fz-raised) 90%, transparent); }
.fz-btn:disabled { opacity: 0.55; cursor: wait; }
.fz-btn.is-primary {
  /* A0: product CTA = accent #5ba0ff; cyan reserved for form/shadcn surfaces */
  border-color: color-mix(in srgb, var(--fz-accent) 45%, var(--fz-border));
  background: color-mix(in srgb, var(--fz-accent) 16%, transparent);
  color: var(--fz-ink);
}
.fz-btn.is-primary:hover {
  background: color-mix(in srgb, var(--fz-accent) 24%, transparent);
}
.fz-btn svg { width: 14px; height: 14px; }

.fz-panel {
  border: 1px solid var(--fz-border);
  border-radius: 12px;
  background: color-mix(in srgb, var(--fz-surface) 94%, transparent);
  box-shadow: var(--toiv-shadow-inner-glow);
}

.fz-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 28px;
  margin: 0 0 8px;
}
.fz-section-head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.fz-section-head a {
  font-size: 12px;
  color: var(--fz-accent);
  text-decoration: none;
}

.fz-dense-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}

.fz-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--fz-border);
  border-radius: 10px;
  background: var(--fz-surface);
  color: inherit;
  text-decoration: none;
  transition: border-color 140ms ease, background 140ms ease;
}
.fz-card:hover {
  border-color: color-mix(in srgb, var(--fz-accent) 35%, var(--fz-border));
  background: var(--fz-raised);
}
.fz-card-title {
  margin: 0;
  font-size: 13px;
  font-weight: 550;
  line-height: 18px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fz-card-meta {
  margin: 0;
  font-size: 11px;
  line-height: 16px;
  color: var(--fz-muted);
}
.fz-phase-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.fz-phase-pip {

/* light theme remains available; do not force dark when html is light */


/* ——— A1 director desk primitives (B-class; no copyright paste) ——— */
.fz-desk-board {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 12px;
  align-items: start;
}
@media (max-width: 1100px) {
  .fz-desk-board { grid-template-columns: 1fr; }
}
.fz-desk-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.fz-desk-rail {
  position: sticky;
  top: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.fz-desk-rail .fz-panel { padding: 10px; }
.fz-desk-rail h3 {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--fz-ink);
}
.fz-stat-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 0 0 8px;
}
.fz-stat {
  display: inline-flex;
  flex-direction: column;
  gap: 2px;
  min-width: 72px;
  padding: 6px 10px;
  border: 1px solid var(--fz-border);
  border-radius: 10px;
  background: color-mix(in srgb, var(--fz-surface) 92%, transparent);
}
.fz-stat strong {
  font-size: 14px;
  font-weight: 650;
  line-height: 18px;
  color: var(--fz-ink);
  font-variant-numeric: tabular-nums;
}
.fz-stat span {
  font-size: 10px;
  line-height: 14px;
  color: var(--fz-muted);
  letter-spacing: 0.02em;
}
.fz-pill-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}
.fz-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--fz-border);
  background: transparent;
  color: var(--fz-muted);
  font-size: 12px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: border-color var(--toiv-motion-base, 220ms) ease, background var(--toiv-motion-base, 220ms) ease, color var(--toiv-motion-base, 220ms) ease;
}
.fz-pill:hover {
  border-color: color-mix(in srgb, var(--fz-accent) 40%, var(--fz-border));
  color: var(--fz-ink);
}
.fz-pill.is-active {
  border-color: color-mix(in srgb, var(--fz-accent) 50%, var(--fz-border));
  background: color-mix(in srgb, var(--fz-accent) 14%, transparent);
  color: var(--fz-ink);
  font-weight: 600;
}
.fz-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fz-list-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 12px;
  align-items: center;
  min-height: 56px;
  padding: 8px 10px;
  border: 1px solid var(--fz-border);
  border-radius: 10px;
  background: var(--fz-surface);
  color: inherit;
  text-decoration: none;
  transition: border-color 140ms ease, background 140ms ease;
}
.fz-list-row:hover {
  border-color: color-mix(in srgb, var(--fz-accent) 35%, var(--fz-border));
  background: var(--fz-raised);
}
.fz-list-row-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fz-list-row-meta {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  justify-content: flex-end;
  color: var(--fz-muted);
  font-size: 11px;
}
.fz-card-poster {
  height: 44px; /* A1: strip, not poster hero */
}
.fz-card.is-compact { padding: 8px; gap: 4px; }
.fz-hint {
  margin: 0;
  font-size: 11px;
  line-height: 16px;
  color: var(--fz-muted);
}
.fz-auth-gap {
  /* Honest session/401 surface — do not fake project data */
  border-style: dashed;
}

/* denser sidebar nav rows inside Freezone product shell */
html.dark .app-user-workspace.app-product-workspace .app-workspace-nav-link,
.dark .app-user-workspace.app-product-workspace .app-workspace-nav-link {
  min-height: 36px;
  padding-block: 6px;
  border-radius: 10px;
}

/* A1 home — director dense desk companion */
.toiv-home {
  height: 100%;
  overflow: auto;
  scrollbar-width: thin;
}
.toiv-home-section { margin-top: 4px; }
.toiv-home-fleet-hint {
  margin: 0;
  padding: 0;
  border: 0;

}
.toiv-home-error {

}
.toiv-home .fz-list-row .fz-card-title { white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  .toiv-home * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* R9 Freezone empty / skeleton / soft motion — accent glow only (#5ba0ff) */

.toiv-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--toiv-empty-gap, 10px);
  padding: var(--toiv-empty-pad-y, 28px) 16px;
  text-align: center;
  animation: toiv-motion-enter var(--toiv-motion-enter-ms, 220ms) var(--toiv-motion-ease-spring, ease) both;
}

.toiv-empty.is-compact {
  padding: var(--toiv-empty-pad-y-compact, 16px) 12px;
  gap: 8px;
}

.toiv-empty-icon {
  display: grid;
  place-items: center;
  width: var(--toiv-empty-icon-d, 48px);
  height: var(--toiv-empty-icon-d, 48px);
  border-radius: 999px;
  background: var(--toiv-empty-icon-bg);
  color: var(--toiv-empty-icon-fg);
}

.toiv-empty.is-compact .toiv-empty-icon {
  width: var(--toiv-empty-icon-d-compact, 36px);
  height: var(--toiv-empty-icon-d-compact, 36px);
}

.toiv-empty-icon svg {
  width: 44%;
  height: 44%;
}

.toiv-empty-title {
  margin: 0;
  font-size: var(--toiv-empty-title-fs, 14px);
  font-weight: var(--toiv-empty-title-fw, 560);
  color: var(--toiv-text, #e8eaf0);
}

.toiv-empty-desc {
  margin: 0;
  max-width: var(--toiv-empty-desc-max, 36ch);
  font-size: var(--toiv-empty-desc-fs, 12px);
  line-height: 1.5;
  color: var(--toiv-text-muted, #6f7079);
}

.toiv-empty-desc a {
  color: var(--toiv-accent, #5ba0ff);
  text-decoration: none;
}

.toiv-empty-desc a:hover {
  text-decoration: underline;
}

.toiv-empty-action {
  margin-top: 4px;
}

.toiv-empty-action .toiv-empty-cta,
.toiv-empty-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: var(--toiv-empty-cta-h, 32px);
  padding: 0 14px;
  border: 0;
  border-radius: var(--toiv-empty-cta-radius, 999px);
  background: color-mix(in srgb, var(--toiv-accent, #5ba0ff) 18%, transparent);
  color: var(--toiv-text, #e8eaf0);
  font-size: 12px;
  text-decoration: none;
  cursor: pointer;
  transition: background var(--toiv-motion-enter-ms, 220ms) var(--toiv-motion-ease);
}

.toiv-empty-cta:hover {
  background: color-mix(in srgb, var(--toiv-accent, #5ba0ff) 28%, transparent);
}

.toiv-empty-cta:focus-visible {
  outline: 2px solid var(--toiv-accent, #5ba0ff);
  outline-offset: 2px;
}

/* Skeleton — local pulse/shimmer, never full-screen spinner */
.toiv-skeleton {
  position: relative;
  overflow: hidden;
  border-radius: var(--toiv-skeleton-radius, 8px);
  background: var(--toiv-skeleton-base);
}

.toiv-skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    105deg,
    transparent 35%,
    var(--toiv-skeleton-shine) 50%,
    transparent 65%
  );
  transform: translateX(-120%);
  animation: toiv-skeleton-shine var(--toiv-skeleton-dur, var(--toiv-skeleton-shimmer-dur, 1.6s)) ease-in-out infinite;
}

.toiv-skeleton-line {
  height: var(--toiv-skeleton-row-h, 12px);
  width: 100%;
}

.toiv-skeleton-line.is-short { width: 42%; }
.toiv-skeleton-line.is-mid { width: 68%; }

.toiv-skeleton-card {
  height: var(--toiv-skeleton-card-h, 96px);
}

.toiv-skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: var(--toiv-skeleton-card-gap, 10px);
  padding: 8px 0;
}

.toiv-skeleton-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
}

.toiv-skeleton-pane {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  flex: 1 1 auto;
  padding: 16px;
  animation: toiv-motion-enter var(--toiv-motion-enter-ms, 220ms) var(--toiv-motion-ease) both;
}

.toiv-skeleton-pane-bar {
  height: 36px;
  width: min(240px, 40%);
}

.toiv-skeleton-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toiv-skeleton-list-row {
  height: 56px;
}

/* Soft pointer glow — restrained; accent only */
.toiv-soft-glow {
  position: relative;
  isolation: isolate;
}

.toiv-soft-glow::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  background: radial-gradient(
    var(--toiv-glow-radius, 140px) circle at var(--toiv-glow-x, 50%) var(--toiv-glow-y, 40%),
    var(--toiv-glow-color),
    transparent 70%
  );
  transition: opacity var(--toiv-motion-enter-ms, 220ms) var(--toiv-motion-ease);
}

.toiv-soft-glow.is-active::before,
.toiv-soft-glow:hover::before {
  opacity: var(--toiv-glow-opacity, 0.55);
}

.toiv-soft-glow > * {
  position: relative;
  z-index: 1;
}

@keyframes toiv-motion-enter {
  from { opacity: 0; transform: translateY(6px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toiv-skeleton-shine {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(120%); }
}

@media (prefers-reduced-motion: reduce) {
  .toiv-empty,
  .toiv-skeleton-pane,
  .toiv-empty-cta {
    animation: none !important;
    transition: none !important;
  }
  .toiv-skeleton::after {
    animation: none !important;
    opacity: 0;
    transform: none;
    background: transparent;
  }
  .toiv-soft-glow::before {
    display: none;
  }
  .toiv-spinner,
  .toiv-spinner-md {
    animation: none !important;
  }
}
