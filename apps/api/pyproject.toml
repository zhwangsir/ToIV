[project]
name = "toiv-api"
version = "0.0.1"
description = "ToIV platform API — ComfyUI orchestration backend (P0)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "paramiko>=3.4",
    "pillow>=12.3.0",
    # 文档上传与长文本理解:pdf/docx 解析(txt/md 直读无需依赖);惰性导入于 services/docs.py
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Redis(限流/画布事件/worker 健康缓存共享状态):不可达时自动降级进程内存,
    # 见 app/services/redis_client.py。生产 core 仅监听 localhost 无密码。
    "redis>=5.2",
    # 可观测性:P2 指标监控 + 错误追踪(空 DSN/未装时自动跳过,不阻断启动)
    "prometheus-fastapi-instrumentator>=7.0",
    "sentry-sdk[fastapi]>=2.0",
    # R3.2 Agent Team 编排(2026-08-14):LangGraph StateGraph + interrupt 确认门
    # + PostgresSaver 断点续跑(SQLite 环境自动回退 MemorySaver,见 services/agent_team_graph.py)
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Redis 路径测试替身(test_redis_integration.py);[lua]=lupa,
    # 缺 lupa 时 fakeredis 不注册 eval/evalsha 命令,限流 Lua 路径测试会静默降级内存而失败
    "fakeredis[lua]>=2.23",
]
scoring = [
    "image-reward",
]
# 译制听写(ASR):faster-whisper(CPU/CTranslate2)。惰性导入,不装只影响听写不拖累启动。
# requests 是 faster-whisper 1.1.1 utils.py 的隐式依赖(未声明,缺则 import 即 ModuleNotFoundError)。
# Dockerfile 已 pip install;此处声明让 uv export 进 requirements.txt,本地 venv 也能装。
transcription = [
    "faster-whisper>=1.1.1",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
