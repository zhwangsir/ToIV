# ToIV API — Alembic 脚手架(待办 #5)。切流前 init_db 双轨仍是启动路径。
# 禁止对生产库直接 alembic upgrade(见 tmp/alembic_cutover_plan_20261018.md)。

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# URL 由 env.py 从 app.config.get_settings().database_url 注入;此处占位勿填密钥。
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
