<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<script>
  try { if (localStorage.getItem("toiv_token")) { document.documentElement.style.visibility = "hidden"; location.replace("/?view=home"); } } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<title>ToIV · 工作台</title>
<meta name="description" content="ToIV 工作台：剧本、分镜、成片轨。">
<link rel="stylesheet" href="/site/styles.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="/" aria-label="ToIV"><span class="logo-mark" aria-hidden="true"></span>ToIV</a>
    <a class="btn btn-ghost btn-sm" href="/?view=home">登录</a>
  </div>
</header>

<main>
  <section class="hero wrap">
    <div class="hero-copy">
      <p class="kicker">工具入口</p>
      <h1>进工作室。</h1>
      <p class="hero-lead">剧本 · 分镜 · 成片轨。登录后进入密台，不在这里演示。</p>
      <div class="cta">
        <a class="btn btn-primary" href="/?view=home">进入工作室</a>
      </div>
    </div>

    <div class="desk-preview" aria-label="工作台预览（示意）">
      <div class="desk-chrome">
        <span class="desk-dot"></span><span class="desk-dot"></span><span class="desk-dot"></span>
        <span class="desk-title">项目 · 雨夜便利店</span>
      </div>
      <div class="desk-body">
        <aside class="desk-rail">
          <div class="desk-rail-item is-active">分镜</div>
          <div class="desk-rail-item">成片</div>
          <div class="desk-rail-item">素材</div>
        </aside>
        <div class="desk-main">
          <div class="desk-strip" aria-hidden="true">
            <div class="desk-cell"><span>01</span>进店</div>
            <div class="desk-cell"><span>02</span>冷柜</div>
            <div class="desk-cell"><span>03</span>结账</div>
            <div class="desk-cell"><span>04</span>出门</div>
          </div>
          <div class="desk-meta">
            <span>4 镜</span>
            <span>竖屏 9:16</span>
            <span>草稿</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="features wrap" aria-label="工作区">
    <article class="card"><h3>分镜台</h3><p class="muted">镜头表与参考</p></article>
    <article class="card"><h3>成片轨</h3><p class="muted">预览与导出</p></article>
    <article class="card"><h3>素材池</h3><p class="muted">镜头 / 音频</p></article>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span class="logo logo-sm"><span class="logo-mark" aria-hidden="true"></span>ToIV</span>
    <span class="muted">工作台</span>
  </div>
</footer>
</body>
</html>
