<!doctype html>
<html class="dark" lang="zh-CN"><head><meta charset=utf-8>
<title>FIXTURE · A4 create · 非现网硬刷</title>
<style>
:root{
  --bg:#0a0c12; --surface:#15161d; --raised:#1b1c23; --panel:#13141b;
  --border:#22232c; --border-strong:#2f3036;
  --text:#e8eaf0; --muted:#9298a6; --faint:#6f7079;
  --accent:#5ba0ff;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,sans-serif}
.badge{position:fixed;top:10px;left:10px;z-index:9;font:600 10px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.04em;color:#0a0c12;background:var(--accent);padding:5px 8px;border-radius:4px}
.shell{display:grid;grid-template-rows:40px 1fr 168px;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--bg)}
.brand{font:650 13px/1 ui-monospace,Menlo,monospace}
.top .spacer{flex:1}
.chip{height:24px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--muted);font-size:11px}
.chip.is-primary{background:var(--accent);border-color:var(--accent);color:#0a0c12;font-weight:600}
.main{display:grid;grid-template-columns:220px 1fr 280px;min-height:0}
.rail,.insp{border-right:1px solid var(--border);background:var(--surface);padding:10px;overflow:auto}
.insp{border-right:0;border-left:1px solid var(--border)}
.h{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border);border-radius:0;background:transparent}
.row:hover{background:color-mix(in srgb,var(--raised) 70%,transparent)}
.row.is-sel{box-shadow:inset 2px 0 0 var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.thumb{width:40px;height:40px;border-radius:4px;background:var(--panel);border:1px solid var(--border);flex:none}
.row b{font-size:12px;font-weight:560}
.row span{display:block;font-size:11px;color:var(--faint)}
.stage{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.viewer{flex:1;display:grid;place-items:center;background:#05060a;position:relative}
.viewer-frame{width:min(420px,70%);aspect-ratio:9/16;border:1px solid var(--border);border-radius:6px;background:linear-gradient(180deg,#15161d,#0a0c12);display:grid;place-items:center;color:var(--faint);font-size:12px}
.play{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#0a0c12;display:grid;place-items:center;cursor:pointer;box-shadow:none}
.play svg{width:14px;height:14px;fill:currentColor}
.insp .stat{font-size:12px;color:var(--muted);margin:0 0 12px}
.insp .list{list-style:none;margin:0;padding:0}
.insp .list li{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.timeline{border-top:1px solid var(--border);background:var(--surface);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.tl-head{display:flex;align-items:center;gap:10px}
.tl-head .meta{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.tracks{position:relative;height:96px;border:1px solid var(--border);border-radius:6px;background:var(--panel);overflow:hidden}
.ruler{height:18px;border-bottom:1px solid var(--border);background:repeating-linear-gradient(90deg,transparent,transparent 47px,var(--border-strong) 47px,var(--border-strong) 48px)}
.clip{position:absolute;height:22px;border-radius:4px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.clip.audio{border-color:var(--border-strong);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);left:120px;z-index:2}
.queue{position:absolute;right:12px;top:48px;width:200px;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:0 8px 24px rgb(0 0 0/.35);padding:8px;font-size:11px}
.queue h4{margin:0 0 6px;font-size:12px}
.qrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.qrow strong{color:var(--text);font-weight:560}
</style></head>
<body>
<div class="badge">FIXTURE · 非现网硬刷 · A4 timeline · squint</div>
<div class="shell">
  <header class="top">
    <span class="brand">ToIV</span>
    <span class="chip">分镜</span>
    <span class="chip">成片</span>
    <span class="spacer"></span>
    <button class="chip is-primary" type="button">生成</button>
  </header>
  <div class="main">
    <aside class="rail">
      <p class="h">媒体池</p>
      <div class="row is-sel"><div class="thumb"></div><div><b>镜 01 · 进店</b><span>图片</span></div></div>
      <div class="row"><div class="thumb"></div><div><b>镜 02 · 冷柜</b><span>图片</span></div></div>
      <div class="row"><div class="thumb"></div><div><b>雨声床</b><span>音频</span></div></div>
      <div class="row"><div class="thumb"></div><div><b>对白轨</b><span>音频</span></div></div>
    </aside>
    <section class="stage">
      <div class="viewer">
        <div class="viewer-frame">预览</div>
        <button class="play" type="button" aria-label="播放"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></button>
      </div>
    </section>
    <aside class="insp">
      <p class="h">属性</p>
      <p class="stat">当前：普通</p>
      <p class="h">区段</p>
      <ul class="list"><li>剧本</li><li>分镜</li><li>参考</li></ul>
    </aside>
  </div>
  <footer class="timeline">
    <div class="tl-head">
      <button class="play" type="button" style="position:static;transform:none;width:28px;height:28px" aria-label="播放"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></button>
      <span class="meta">00:04 / 00:54 · 96 px/s</span>
    </div>
    <div class="tracks">
      <div class="ruler"></div>
      <div class="playhead"></div>
      <div class="clip" style="left:12px;top:28px;width:140px"></div>
      <div class="clip" style="left:160px;top:28px;width:100px"></div>
      <div class="clip audio" style="left:12px;top:58px;width:220px"></div>
    </div>
  </footer>
</div>
</body></html>
