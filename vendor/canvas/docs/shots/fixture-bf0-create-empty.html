<!doctype html>
<html class="dark" lang="zh-CN"><head><meta charset=utf-8>
<title>FIXTURE · BF0 create empty · 非现网硬刷</title>
<style>
:root{--bg:#0b0c0f;--raised:#14151a;--panel:#101116;--text:#f4f6f7;--muted:#8b8e98;--line:rgba(255,255,255,.10);--accent:#4A7FC1}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif}
.badge{position:fixed;top:10px;left:10px;z-index:9;font:600 10px/1.2 ui-monospace,Menlo,monospace;color:#f4f6f7;background:var(--accent);padding:5px 8px;border-radius:4px}
.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 24px 40px}
.heading{text-align:center;margin-bottom:18px}
.heading h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.heading p{margin:8px 0 0;font-size:13px;color:var(--muted);font-weight:450}
.stage{width:min(720px,100%);border:1px solid var(--line);border-radius:12px;background:var(--raised);padding:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;justify-content:center}
.tab{height:32px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600}
.tab.on{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.composer{min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;color:var(--muted)}
.bar{display:flex;justify-content:flex-end;margin-top:10px}
.cta{height:36px;padding:0 16px;border:0;border-radius:999px;background:var(--accent);color:#f4f6f7;font-weight:600;font-size:13px}
.quiet{width:min(720px,100%);margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.quiet p{margin:0;font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.qcta{display:inline-flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);text-align:left}
.qcta strong{font-size:12px;font-weight:600}.qcta span{font-size:11px;color:var(--muted)}
.note{margin-top:28px;font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
</style></head><body>
<div class="badge">FIXTURE · 非现网硬刷 · BF0 create empty</div>
<div class="shell">
  <div class="heading"><h1>创作台</h1><p>输入提示词，或从下方入口开始。</p></div>
  <section class="stage" aria-label="开始创作">
    <div class="tabs"><button class="tab">图像</button><button class="tab on">视频</button><button class="tab">文本</button></div>
    <div class="composer">描述画面、镜头运动与光线…</div>
    <div class="bar"><button class="cta" id="cta">生成</button></div>
  </section>
  <div class="quiet">
    <p>在上方输入提示词开始，或选用一条入口。</p>
    <div class="row">
      <button class="qcta"><strong>生成镜头</strong><span>描述画面与运镜</span></button>
      <button class="qcta"><strong>参考图</strong><span>从素材库选图</span></button>
      <button class="qcta"><strong>续写故事</strong><span>剧情与对白</span></button>
      <button class="qcta"><strong>3D 工具</strong><span>图生 3D / 相机</span></button>
    </div>
  </div>
  <p class="note">BF0 · composer-first · 无 FeaturedWorks / 灵感瀑布 / 意图墙 · accent #4A7FC1 · ?project= 三栏另保留</p>
</div>
</body></html>
