<div id="toiv-session-chip" style="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:2147483000;display:none;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--foreground);font-family:var(--font-sans);font-size:12px;line-height:18px"><img src="/logo.svg" alt="" style="width:18px;height:18px;border-radius:5px"><span id="toiv-session-name"></span><a href="#" id="toiv-logout" style="color:var(--muted-foreground);text-decoration:none">退出</a></div>
<script>(function(){fetch("/auth/me",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(!d||!d.user)return;var c=document.getElementById("toiv-session-chip");document.getElementById("toiv-session-name").textContent=d.user.name||d.user.email||"ToIV 用户";c.style.display="flex"});document.getElementById("toiv-logout").addEventListener("click",function(e){e.preventDefault();fetch("/auth/logout",{method:"POST",credentials:"same-origin"}).then(function(){location.href="/login"})})})();</script>
