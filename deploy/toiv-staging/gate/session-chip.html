<div id="toiv-session-chip" style="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:2147483000;display:none;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(20,23,34,.82);border:1px solid #2a2f45;color:#cfd3e2;font:12px -apple-system,'PingFang SC',sans-serif;backdrop-filter:blur(6px)"><img src="/toiv-mark.svg" alt="" style="width:14px;height:14px"><span id="toiv-session-name"></span><a href="#" id="toiv-logout" style="color:#8ea0ff;text-decoration:none">退出</a></div>
<script>(function(){fetch("/auth/me",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(!d||!d.user)return;var c=document.getElementById("toiv-session-chip");document.getElementById("toiv-session-name").textContent=d.user.name||d.user.email||"ToIV 用户";c.style.display="flex"});document.getElementById("toiv-logout").addEventListener("click",function(e){e.preventDefault();fetch("/auth/logout",{method:"POST",credentials:"same-origin"}).then(function(){location.href="/login"})})})();</script>
